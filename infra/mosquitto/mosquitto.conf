# Mosquitto configuration for perch development.
#
# Perch is not a message broker (see ARCHITECTURE.md, "What perch is not"): MQTT is
# transport we speak, so this file is configuration, not code. Mosquitto is the broker
# that sits between the publishers (the agent / LHM relay) and the consumers (the
# dashboard in a browser tab).
#
# Every directive below is commented, because the point of this file is that someone who
# has never configured Mosquitto can read it and know why each line is here.
#
# Run it deliberately, in the foreground, from the repo root:
#
#     mosquitto -c infra/mosquitto/mosquitto.conf -v
#
# See README.md in this directory for verification and for the multi-machine case.


# ─────────────────────────────────────────────────────────────────────────────
# Listener 1 of 2 — native MQTT, for server-to-server publishers
# ─────────────────────────────────────────────────────────────────────────────
#
# `listener <port> <bind address>` opens a socket. Everything until the next `listener`
# line configures THIS listener.
#
# 1883 is the IANA-registered port for MQTT. The perch consumer here is the relay/agent:
# a Node process reading LibreHardwareMonitor and publishing readings. It speaks native
# MQTT because wrapping a server-to-server connection in WebSockets buys nothing and
# costs an extra framing layer on every message.
#
# The second argument, `127.0.0.1`, is the bind address, and it is the single most
# important safety line in this file. Bound to loopback, only processes on this machine
# can connect, which is what makes `allow_anonymous true` below defensible. Remove it (or
# widen it) and the broker becomes reachable from the whole LAN, anonymously. Read the
# "Exposing this broker to the LAN" section of README.md before you do that.
listener 1883 127.0.0.1

# `protocol` selects the wire protocol for the listener above. `mqtt` is the default, but
# it is stated explicitly here so the contrast with the WebSockets listener is legible
# rather than implied by omission.
protocol mqtt


# ─────────────────────────────────────────────────────────────────────────────
# Listener 2 of 2 — MQTT over WebSockets, for the browser
# ─────────────────────────────────────────────────────────────────────────────
#
# A browser cannot open a raw TCP socket, so it cannot speak native MQTT at all. Its only
# route to a broker is MQTT framed inside a WebSocket. That is not a perch preference; it
# is a constraint of the platform.
#
# This is the listener `packages/sensor-sources` connects to. `RELAY_WEBSOCKET_PORT` in
# `packages/sensor-sources/src/relay-endpoint.ts` is 9001 and its default host is
# `localhost`, so `relayWebSocketUrl()` yields `ws://localhost:9001` — which is exactly
# this listener. If you change the port here, change it there; the two must agree.
#
# Configuring both listeners rather than only this one is deliberate. A single
# WebSockets-only listener would work for every consumer, but it would make the relay pay
# for a limitation that only the browser has.
listener 9001 127.0.0.1

# Frame MQTT inside WebSockets on this listener. Without this line Mosquitto would speak
# native MQTT on 9001 and a browser client would fail to connect for reasons that look
# like a network problem rather than a protocol mismatch.
protocol websockets


# ─────────────────────────────────────────────────────────────────────────────
# Authentication — local development posture, deliberately temporary
# ─────────────────────────────────────────────────────────────────────────────
#
# Mosquitto 2.x refuses anonymous clients by default, which is the right default and the
# reason this line has to be explicit rather than absent.
#
# Anonymous access is correct here ONLY because both listeners above are bound to
# 127.0.0.1: the trust boundary is the machine, and anything that can reach these sockets
# can already read the sensor values by other means. It becomes wrong the moment a
# listener is bound to a LAN-reachable address.
#
# No credentials are configured, on purpose — setting up a password file is a decision
# for the human who owns the machine, not a default this config should assume. README.md
# states what changes when the broker is exposed.
allow_anonymous true


# ─────────────────────────────────────────────────────────────────────────────
# Logging — so a failed connection is diagnosable
# ─────────────────────────────────────────────────────────────────────────────
#
# Log to standard output rather than a file: this broker is started deliberately in a
# terminal, and a log file path would be machine-specific state committed to the repo.
log_dest stdout

# Which categories to log. `notice` and `information` between them produce the startup
# lines that name each listener and its port, which is how you confirm the config that is
# actually loaded matches the file you think you edited.
log_type notice
log_type warning
log_type error
log_type information

# Log a line per client connect and disconnect, naming the client id. This is how you
# tell "the dashboard never connected" apart from "the dashboard connected and received
# nothing", which are very different bugs and otherwise look identical from the browser.
connection_messages true

# Prefix every log line with a readable timestamp instead of a raw Unix epoch, so a
# captured log is legible without conversion.
log_timestamp_format %Y-%m-%dT%H:%M:%S


# ─────────────────────────────────────────────────────────────────────────────
# Persistence — off, deliberately
# ─────────────────────────────────────────────────────────────────────────────
#
# With persistence off, retained messages and queued sessions live in memory only and are
# gone when the broker restarts.
#
# This matters for one thing specifically: per `packages/sensor-contract/SPEC.md`, sensor
# metadata is published to a RETAINED companion topic
# (`sensors/<device>/<i>/<metric>/<j>/meta`) so a dashboard that connects late still
# learns the human-readable labels. After a broker restart those retained labels are gone
# until the publisher republishes them.
#
# Off is still the right default for development: turning it on requires naming a
# writable directory, which is machine-local state that does not belong in a config file
# in the repo, and it makes a stale retained value outlive the process that published it
# — which is a confusing failure to debug. The publisher republishing its metadata on
# connect is the durable fix, and it is the publisher's job either way.
persistence false
