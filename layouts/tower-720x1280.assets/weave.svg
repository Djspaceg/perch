<!--
  Backdrop for tower-720x1280: a warm diagonal weave on paper, the opposite register to the desk
  panel's dark rails. One 32px pattern tile repeated, so the file is a few hundred bytes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <pattern id="weave" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#f4efe6" />
      <path d="M0 32 L32 0" stroke="#d8cdb8" stroke-width="3" />
      <path d="M0 0 L32 32" stroke="#e6ddcb" stroke-width="3" />
    </pattern>
  </defs>
  <rect width="720" height="1280" fill="url(#weave)" />
</svg>
